<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181920"/>
      <stop offset="100%" stop-color="#090A0F"/>
    </linearGradient>
    <radialGradient id="aura" cx="75%" cy="22%" r="78%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="26" y1="98" x2="102" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="48%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="spark" x1="44" y1="84" x2="88" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Squircle Obsidian Canvas -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#aura)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="29.25" stroke="white" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Luminous Open Orbit Ring -->
  <path d="M92.5 52A32 32 0 1 1 76 35.5" stroke="url(#ring)" stroke-width="10.5" stroke-linecap="round"/>

  <!-- Sculpted 4-Point Star Core (Ascending toward top-right) -->
  <path d="M68 28C68 47.5 80.5 60 100 60C80.5 60 68 72.5 68 92C68 72.5 55.5 60 36 60C55.5 60 68 47.5 68 28Z" fill="url(#spark)"/>
</svg>
